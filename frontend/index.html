<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrusquetaIA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── LEFT: Agent List ─────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 class="logo">Brusqueta<span>IA</span></h1>
      <button class="btn-new-agent" id="btnNewAgent">+ Novo Agente</button>
    </div>
    <div class="agent-list" id="agentList">
      <p class="empty-hint">Nenhum agente criado.</p>
    </div>
  </aside>

  <!-- ── MAIN: Chat ───────────────────────────────────────────────────────── -->
  <main class="chat-main">

    <div class="chat-empty-state" id="emptyMain">
      <div class="empty-icon">💬</div>
      <h2>Selecione um agente para começar</h2>
      <p>Escolha ou crie um agente na barra lateral.</p>
    </div>

    <div class="chat-container hidden" id="chatContainer">
      <div class="chat-header">
        <div class="chat-agent-info">
          <div class="chat-agent-dot" id="chatAgentDot"></div>
          <span class="chat-agent-name" id="chatAgentName"></span>
        </div>
        <div class="chat-header-actions">
          <button class="btn-clear" id="btnClearChat">Limpar histórico</button>
          <button class="btn-settings" id="btnOpenSettings" title="Configurar agente">⚙️</button>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <textarea id="chatInput" placeholder="Digite sua pergunta…" rows="2"></textarea>
        <button class="btn-send" id="btnSend">Enviar</button>
      </div>
    </div>

  </main>

  <!-- ── Modal: New Agent ──────────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h2>Novo Agente</h2>

      <label for="modalName">Nome *</label>
      <input type="text" id="modalName" placeholder="Ex: Agente Jurídico" />

      <label for="modalDesc">Descrição</label>
      <input type="text" id="modalDesc" placeholder="Breve descrição" />

      <label for="modalPrompt">
        System Prompt
        <span class="modal-prompt-hint">Use <code>{context}</code> para posicionar os documentos.</span>
      </label>
      <textarea id="modalPrompt" rows="5" placeholder="Escreva as instruções do agente…"></textarea>

      <label for="modalColor">Cor</label>
      <input type="color" id="modalColor" value="#6366f1" />

      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancelModal">Cancelar</button>
        <button class="btn-primary" id="btnCreateAgent">Criar Agente</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: Agent Settings ────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="settingsOverlay">
    <div class="modal modal-settings">
      <div class="settings-header">
        <h2>Configurar Agente</h2>
        <button class="btn-close" id="btnCloseSettings">✕</button>
      </div>

      <label for="agentNameInput">Nome</label>
      <input type="text" id="agentNameInput" placeholder="Nome do agente" />

      <label for="agentDescInput">Descrição</label>
      <input type="text" id="agentDescInput" placeholder="Descrição" />

      <label for="agentPromptInput">
        System Prompt
        <span class="modal-prompt-hint">Use <code>{context}</code> para posicionar os documentos.</span>
      </label>
      <textarea id="agentPromptInput" rows="6" placeholder="Instruções do agente…"></textarea>

      <div class="settings-section-title">Documentos</div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">📄</div>
        <p>Arraste PDFs aqui ou
          <label class="file-label" for="fileInput">clique para selecionar</label>
        </p>
        <input type="file" id="fileInput" multiple accept=".pdf" hidden />
      </div>
      <div class="upload-progress-list" id="uploadProgressList"></div>

      <div class="docs-list" id="docsList">
        <p class="no-docs">Nenhum documento indexado.</p>
      </div>

      <div class="modal-actions settings-actions">
        <button class="btn-danger-sm" id="btnDeleteAgent">Excluir Agente</button>
        <button class="btn-primary" id="btnSaveAgent">Salvar</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
